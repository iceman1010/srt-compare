name: Build PHAR & Create Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, intl
        ini-values: post_max_size=256M, short_open_tag=On
        tools: composer

    - name: Get Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: composer-${{ runner.os }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-suggest --optimize-autoloader

    - name: Install humbug/box
      run: ./vendor/bin/box --version || composer require --dev humbug/box ^4.5

    - name: Get version from VERSION file
      id: version
      run: |
        VERSION=$(cat VERSION | tr -d ' \t\n\r')
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Version detected: $VERSION"

    - name: Compile PHAR
      run: ./vendor/bin/box compile

    - name: Create Release & Upload PHAR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: srt-compare v${{ steps.version.outputs.VERSION }}
        body: |
          srt-compare v${{ steps.version.outputs.VERSION }}

          ### Installation
          Download the `srt-compare.phar` file and make it executable:
          ```bash
          chmod +x srt-compare.phar
          sudo mv srt-compare.phar /usr/local/bin/srt-compare
          ```

          ### Usage
          ```bash
          srt-compare -i file1.srt -i file2.srt
          ```

          ### Changes
          See commit history: https://github.com/${{ github.repository }}/commits/main
        files: srt-compare.phar
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload PHAR as artifact (for PRs)
      uses: actions/upload-artifact@v4
      with:
        name: srt-compare-phar
        path: srt-compare.phar
        retention-days: 30